name: AnderStore Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a stable versioned release
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-26
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: AnderStore.ipa
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Check user-facing branding
        run: bash Scripts/check_user_facing_branding.sh

      - name: Test AnderStore logic
        run: swift test

      - name: Pre-populate Core binary artifacts
        run: |
          ARTIFACTS_DIR="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          curl -fsSL "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip" -o "$ARTIFACTS_DIR/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          curl -fsSL "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/Unicorn.xcframework.zip" -o "$ARTIFACTS_DIR/https___github_com_mahee96_unicorn_releases_download_2_1_4_multiarch_Unicorn_xcframework_zip"

      - name: Build AnderStore Core
        working-directory: Core
        run: |
          set -o pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | xcbeautify --renderer github-actions
          make fakesign
          make ipa
          ls -la SideStore.ipa

      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Set AnderStore version
        id: version
        run: |
          VERSION="1.6.${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" LiveContainer/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" LiveContainer/Info.plist
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ANDERSTORE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "AnderStore version $VERSION"

      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | xcpretty && exit ${PIPESTATUS[0]}
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          sh .github/build_github.sh
          unzip -p AnderStore.ipa Payload/LiveContainer.app/components.json > components.json
          unzip -p AnderStore.ipa Payload/LiveContainer.app/Info.plist > AnderStore-Info.plist
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" AnderStore-Info.plist)
          COMPONENT_VERSION=$(ruby -rjson -e 'puts JSON.parse(File.read("components.json"))["anderstore"]')
          test "$IPA_VERSION" = "$ANDERSTORE_VERSION"
          test "$COMPONENT_VERSION" = "$ANDERSTORE_VERSION"

      - name: Upload AnderStore
        uses: actions/upload-artifact@v7
        with:
          name: AnderStore.ipa
          path: |
            AnderStore.ipa
            components.json

  release:
    name: Stable Release
    permissions:
      contents: write
    if: inputs.publish_release
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release-stable
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la AnderStore.ipa
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" AnderStore.ipa components.json \
            --title "AnderStore $VERSION" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "${{ env.COMMIT_MSG }}"
          gh release view "v$VERSION" --json assets --jq ".assets[].name"
